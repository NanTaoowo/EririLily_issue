name: 🐛 Bug/问题 反馈
description: 提交游戏 Bug 报告，帮助我们修复问题
title: "[Bug/问题]: "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这份 Bug 报告！
        请尽量提供详细信息，以便我们更快定位和修复问题。

  - type: input
    id: version
    attributes:
      label: 客户端版本
      description: 请提供客户端的版本号（例如 v26.2）
      placeholder: "例如：v26.2"
    validations:
      required: true

  - type: input
    id: ID
    attributes:
      label: 游戏ID
      description: 请提供你的游戏ID（例如 EririLily）
      placeholder: "例如：EririLily"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述这个 Bug 是什么。
      placeholder: |
        例如：在打开背包时游戏闪退...
        坐标: -1200 63 100
        时间: 18:30
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够复现该问题的详细步骤。
      placeholder: |
        1. 打开游戏
        2. 点击 '...'
        3. 滑动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: "应该正常打开背包界面"

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 视频（如有）
      description: 请拖拽或粘贴截图、录屏或错误日志，这能极大帮助我们定位问题。
      placeholder: "请粘贴图片或日志文本"

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有 Issues，确认没有重复提交该问题。
          required: true
        - label: 我已删除craftengine模组，问题仍然存在。
          required: false
