name: 💡 功能建议 / 改进提议
description: 为游戏提出新功能、玩法改进或优化建议
title: "[建议]: "
labels: ["enhancement", "待评估"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你愿意花时间提出建议！
        我们会认真阅读每一条反馈，但由于工作量原因，无法保证所有建议都会被采纳。

  - type: dropdown
    id: category
    attributes:
      label: 建议类别
      description: 你的建议属于哪一类？
      options:
        - 新玩法 / 新模式
        - 新道具 / 新角色 / 新地图
        - UI / UX 优化
        - 性能优化
        - 平衡性调整
        - 社交 / 多人功能
        - 本地化 / 翻译
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 这个建议是为了解决什么问题？
      description: 请描述你当前遇到的问题或不爽的体验。
      placeholder: "例如：当前背包整理非常繁琐，每次都要手动排序..."

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 请清晰描述你希望游戏如何改进或增加什么功能。
      placeholder: "例如：增加一键按类别/稀有度自动整理背包的功能"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（选填）
      description: 是否有其他方式能达成类似效果？
      placeholder: "例如：或者提供多种排序筛选方式"

  - type: textarea
    id: mockup
    attributes:
      label: 参考截图 / 概念图（选填）
      description: 如果你有参考图、手绘草图或 UI 设计，可以粘贴在这里。
      placeholder: "拖拽或粘贴图片"

  - type: textarea
    id: extra
    attributes:
      label: 额外补充信息（选填）
      description: 其他你想告诉我们的内容。

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有 Issues，确认没有重复提出该建议。
          required: true